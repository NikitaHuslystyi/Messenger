<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}World_IT{% endblock %}</title>
    <link rel="stylesheet" href= "{{ url_for('static', filename='css/style.css')}}">
    {% block links %}
    {% endblock %}
</head>
<body>

    {% endblock %}

        {% block content %} 
        {% endblock %}

    <footer>

    </footer>
    
    {% block scripts %} 
    {% endblock %}
    
</body>
</html>
